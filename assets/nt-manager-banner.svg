<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">NT MANAGER — Your Development Environment. Simplified.</title>
  <desc id="desc">A dark, modern project banner with blue, violet, and cyan accents.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080d19"/><stop offset="1" stop-color="#11162b"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#46a6ff"/><stop offset=".52" stop-color="#8d68ff"/><stop offset="1" stop-color="#36d9e8"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#6c53dd" stop-opacity=".3"/><stop offset="1" stop-color="#6c53dd" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="42"/></filter>
  </defs>
  <rect width="1600" height="560" rx="32" fill="url(#background)"/>
  <ellipse cx="1320" cy="120" rx="300" ry="220" fill="url(#glow)" filter="url(#blur)"/>
  <path d="M0 450C360 385 610 550 980 440s440-40 620-120v240H0Z" fill="#121a31" opacity=".55"/>
  <g transform="translate(112 118)">
    <rect width="68" height="68" rx="20" fill="url(#accent)"/>
    <path d="M20 22h28M20 34h28M20 46h18" fill="none" stroke="#fff" stroke-linecap="round" stroke-width="5" opacity=".95"/>
    <circle cx="49" cy="47" r="3" fill="#fff"/>
  </g>
  <text x="112" y="276" fill="#f4f7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="78" font-weight="750" letter-spacing="-2">NT MANAGER</text>
  <text x="116" y="336" fill="#bdc9e2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="500">Your Development Environment. Simplified.</text>
  <text x="116" y="390" fill="#8393b2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">A focused vision for project workflows, Android tools, and application analysis.</text>
  <g transform="translate(116 438)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650" letter-spacing="1.2">
    <rect width="152" height="36" rx="18" fill="#17243d" stroke="#2d466c"/><text x="20" y="23" fill="#83bdff">PROJECT WORKFLOWS</text>
    <rect x="166" width="125" height="36" rx="18" fill="#201d3a" stroke="#494073"/><text x="187" y="23" fill="#b8a5ff">ANDROID TOOLS</text>
    <rect x="305" width="159" height="36" rx="18" fill="#142a35" stroke="#285363"/><text x="326" y="23" fill="#7ee4ed">APK ANALYSIS</text>
  </g>
  <text x="1480" y="510" text-anchor="end" fill="#697997" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" letter-spacing="1">DESIGNED FOR DEVELOPERS · BUILT FOR PRODUCTIVITY</text>
</svg>
